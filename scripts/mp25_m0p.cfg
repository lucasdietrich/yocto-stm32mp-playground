# mp25_m0p.cfg
#
# Bundles the OpenOCD startup commands used to debug the STM32MP257F-DK
# into a single config file, equivalent to:
#
#   openocd -f interface/stlink.cfg -c "transport select swd" \
#           -f target/st/stm32mp25x.cfg
#
# Usage:
#   openocd -f mp25_m0p.cfg
#
# GDB ports opened by target/st/stm32mp25x.cfg:
#   3333 -> stm32mp25x.a35_0
#   3334 -> stm32mp25x.m33
#   3335 -> stm32mp25x.m0p   <-- the one you want for CM0PLUS_DEMO

source [find interface/stlink.cfg]

transport select swd

source [find target/st/stm32mp25x.cfg]

# ---------------------------------------------------------------------------
# Automatically arm vector_catch on m0p as soon as it is examined, so the
# core halts at the very first instruction after any reset - no manual
# "monitor cortex_m vector_catch reset" needed. Event handlers run with the
# owning target already selected as current, so no "targets" select is
# required here.
#
# vector_catch is sticky: once armed it stays armed across further resets
# too, so this only needs to fire once (examine-end), not on every reset.
# ---------------------------------------------------------------------------

stm32mp25x.m0p configure -event examine-end {
    cortex_m vector_catch reset
    echo "m0p: vector_catch armed automatically (examine-end)"
}

# To disable the automatic catch for a session, run from GDB:
#   monitor cortex_m vector_catch none
# or from the telnet console (port 4444):
#   targets stm32mp25x.m0p
#   cortex_m vector_catch none