# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-playground"
BBFILE_PATTERN_meta-playground = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-playground = "6"

LAYERDEPENDS_meta-playground = "core"
LAYERSERIES_COMPAT_meta-playground = "scarthgap wrynose"

DISTRO ?= "amy"

AMY_DEBUG_UTILS ??= "1"
AMY_DEBUG_SSH ??= "1"

RUST_PANIC_STRATEGY:class-target ?= "abort"

# user/group
USERADD_UID_TABLES += "files/playground-passwd"
USERADD_GID_TABLES += "files/playground-group"

USERADDEXTENSION = "useradd-staticids"
USERADD_ERROR_DYNAMIC = "error"

PREFERRED_PROVIDER_virtual/runc = "crun"