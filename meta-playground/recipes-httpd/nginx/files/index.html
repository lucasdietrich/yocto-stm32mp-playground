<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f1117;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 2rem;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1.5rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        nav a {
            display: block;
            width: 100%;
            padding: 0.65rem 1rem;
            text-decoration: none;
            color: #a0a8c0;
            background: #22263a;
            font-size: 0.95rem;
            transition: background 0.15s, color 0.15s;
        }

        nav a:hover {
            background: #2a3058;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>Gateway</h1>
    <nav>
        <ul>
            <li><a href="/swupdate/">Software Update</a></li>
        </ul>
    </nav>
</body>
</html>
